<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Ghostty's font everywhere an app asks for a generic font (sans-serif, serif, monospace,
     system-ui). Apps or web pages that name their own font, or ship one (like Signal),
     keep it. Delete this file to undo. -->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Maple Mono NF</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Maple Mono NF</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Maple Mono NF</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Maple Mono NF</family></prefer></alias>
</fontconfig>
