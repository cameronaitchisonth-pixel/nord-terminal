# GNOME settings for the Nord desktop (Ubuntu 24.04 / GNOME 46).
# install.sh loads this with:  dconf load /org/gnome/ < settings.ini
# Light/dark itself is switched by nord-mode, which also changes the theme names below
# and the colors of the dock and Search Light. Keyboard shortcuts are added by install.sh.

[desktop/interface]
gtk-theme='Colloid-Light-Nord'
icon-theme='Colloid-Nord-Light'
cursor-theme='Colloid-cursors'
font-name='Maple Mono NF 11'
document-font-name='Maple Mono NF 11'
monospace-font-name='Maple Mono NF 12'

[desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

# Super+Space opens Search Light instead of switching keyboard layouts
[desktop/wm/keybindings]
switch-input-source=['XF86Keyboard']

[desktop/background]
picture-options='zoom'
primary-color='#2E3440'

[shell/extensions/user-theme]
name='Colloid-Light-Nord'

# Ubuntu Dock: left side, see-through Nord background (color follows nord-mode)
[shell/extensions/dash-to-dock]
dock-position='LEFT'
dock-fixed=true
multi-monitor=true
dash-max-icon-size=34
transparency-mode='FIXED'
custom-background-color=true
background-color='#E5E9F0'
background-opacity=0.85

# Quieter overview: no workspace switcher, search box or window captions
[shell/extensions/just-perfection]
animation=5
search=false
type-to-search=true
weather=false
world-clock=false
window-preview-caption=false
window-preview-close-button=true
workspace=false
workspace-popup=false
workspace-switcher-should-show=false

# Launcher on Super+Space (colors set by nord-mode)
[shell/extensions/search-light]
shortcut-search=['<Super>space']
blur-background=true
border-radius=1.5
border-thickness=1

[shell/extensions/vitals]
hot-sensors=['_processor_usage_', '_memory_usage_', '__temperature_max__']
position-in-panel=2

[shell/extensions/clipboard-indicator]
history-size=50
move-item-first=true
toggle-menu=['<Super><Shift>v']

[shell/extensions/ding]
show-home=false

# Blur my Shell: blurred top bar; the dock and app windows are plainly see-through instead
[shell/extensions/blur-my-shell/panel]
corner-radius=0

[shell/extensions/blur-my-shell/dash-to-dock]
blur=false

[shell/extensions/blur-my-shell/applications]
blur=false
dynamic-opacity=false
opacity=255
whitelist=['com.mitchellh.ghostty', 'signal']
