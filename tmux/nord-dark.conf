# Nord dark palette for the tmux status bar (sourced by ~/.tmux.conf and nord-term)
set -g @nord_bg        "default"   # transparent: Ghostty background shows through
set -g @nord_surface   "#3B4252"
set -g @nord_muted     "#7B88A1"
set -g @nord_fg        "#D8DEE9"
set -g @nord_accent    "#88C0D0"
set -g @nord_accent_fg "#2E3440"
set -g @nord_yellow    "#EBCB8B"
set -g @nord_green     "#A3BE8C"
set -g @nord_warn       "#EBCB8B"
set -g @nord_alert      "#D08770"
set -g @nord_ok         "#A3BE8C"

# Colorful status bar: text on colored pills, and the per-window color cycle
set -g @nord_on        "#2E3440"
set -g @nord_c1        "#88C0D0"
set -g @nord_c2        "#A3BE8C"
set -g @nord_c3        "#B48EAD"
set -g @nord_c4        "#D08770"
set -g @nord_c5        "#EBCB8B"
set -g @nord_c6        "#8FBCBB"

set -g status-style "bg=default,fg=#D8DEE9"
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#88C0D0"
set -g message-style "bg=#3B4252,fg=#88C0D0"
set -g message-command-style "bg=#3B4252,fg=#88C0D0"
set -g mode-style "bg=#434C5E,fg=#ECEFF4"
set -g display-panes-colour "#4C566A"
set -g display-panes-active-colour "#88C0D0"
setw -g clock-mode-colour "#88C0D0"
set -g popup-border-style "fg=#88C0D0"
