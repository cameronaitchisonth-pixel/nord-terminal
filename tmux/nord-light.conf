# Nord light palette for the tmux status bar (sourced by ~/.tmux.conf and nord-term)
set -g @nord_bg        "default"   # transparent: Ghostty background shows through
set -g @nord_surface   "#D8DEE9"
set -g @nord_muted     "#4C566A"
set -g @nord_fg        "#2E3440"
set -g @nord_accent    "#5E81AC"
set -g @nord_accent_fg "#ECEFF4"
set -g @nord_yellow    "#EBCB8B"
set -g @nord_green     "#A3BE8C"
set -g @nord_warn       "#B3862C"
set -g @nord_alert      "#BF616A"
set -g @nord_ok         "#6E8F53"

# Colorful status bar: text on colored pills, and the per-window color cycle
set -g @nord_on        "#ECEFF4"
set -g @nord_c1        "#5E81AC"
set -g @nord_c2        "#6E8F53"
set -g @nord_c3        "#9A7096"
set -g @nord_c4        "#B8694A"
set -g @nord_c5        "#B3862C"
set -g @nord_c6        "#4C8A88"

set -g status-style "bg=default,fg=#2E3440"
set -g pane-border-style "fg=#D8DEE9"
set -g pane-active-border-style "fg=#5E81AC"
set -g message-style "bg=#D8DEE9,fg=#2E3440"
set -g message-command-style "bg=#D8DEE9,fg=#2E3440"
set -g mode-style "bg=#D8DEE9,fg=#2E3440"
set -g display-panes-colour "#D8DEE9"
set -g display-panes-active-colour "#5E81AC"
setw -g clock-mode-colour "#5E81AC"
set -g popup-border-style "fg=#5E81AC"
