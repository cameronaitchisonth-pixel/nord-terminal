set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g default-terminal "screen-256color"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'nordtheme/tmux'  # replaced by the Nord status bar below
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Plugin configurations
# Session persistence: continuum auto-saves every 15 min; restore the last save when tmux starts
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# Relaunch these in restored panes (each Claude pane resumes its own conversation)
set -g @resurrect-processes '"~claude->~/.local/bin/claude-tmux-session resume" lazygit btop yazi'
# Save which Claude conversation runs in each pane (restored by claude-tmux-session resume)
set -g @resurrect-hook-post-save-all '~/.local/bin/claude-tmux-session save'

# Battery
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_attached ''
set -g @batt_icon_status_discharging ''

# CPU
set -g @cpu_low_icon "=" # icon when cpu is low
set -g @cpu_medium_icon "≡" # icon when cpu is medium
set -g @cpu_high_icon "≣" # icon when cpu is high

# Prefix highlight
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green'

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Image previews (yazi) inside tmux: let graphics escape sequences through
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Window switching: Alt+1..9 jump directly, prefix Tab = last window,
# prefix w = fuzzy picker with previews (prefix W = the built-in tree)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind Tab last-window
# Reorder windows: Ctrl+Shift+Left/Right moves the current window (and you stay on it)
bind -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-S-Right swap-window -t +1 \; select-window -t +1
bind w display-popup -E -w 80% -h 70% "~/.local/bin/tmux-window-picker"
bind W choose-tree -Zw

# Popups: lazygit (g), session switcher (f), yazi (e), in the current pane's folder
set -g popup-border-lines rounded
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi
bind f display-popup -E -w 60% -h 50% "tmux list-sessions -F '#S  (#{session_windows} windows#{?session_attached, - attached,})' | fzf --reverse --no-info --prompt='session ❯ ' --color=fg:-1,bg:-1,hl:4,fg+:-1,bg+:-1,hl+:6,pointer:6,prompt:4,border:8 | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# --- Nord status bar -----------------------------------------------------------
# Colors live in ~/.config/tmux/nord-{dark,light}.conf; nord-term re-sources the
# right one when you switch light/dark. Keep this block above `run tpm`
# so tmux-continuum can attach its auto-save hook to status-right.
if-shell '[ "$(~/.local/bin/nord-term status 2>/dev/null)" = light ]' \
  'source-file ~/.config/tmux/nord-light.conf' \
  'source-file ~/.config/tmux/nord-dark.conf'

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120
set -g window-status-separator ""

# Session pill: accent normally, yellow while the prefix is held, orange in copy mode
set -g status-left "#[fg=#{?client_prefix,#{@nord_c5},#{?pane_in_mode,#{@nord_c4},#{@nord_accent}}},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{?client_prefix,#{@nord_c5},#{?pane_in_mode,#{@nord_c4},#{@nord_accent}}},bold] #S #[fg=#{?client_prefix,#{@nord_c5},#{?pane_in_mode,#{@nord_c4},#{@nord_accent}}},bg=#{@nord_bg},nobold]  "

# Each window gets its own color, cycling by number (1 cyan, 2 green, 3 purple, 4 orange, 5 yellow, 6 teal)
set -g @nord_wc "#{?#{==:#{e|m:#{window_index},6},1},#{@nord_c1},#{?#{==:#{e|m:#{window_index},6},2},#{@nord_c2},#{?#{==:#{e|m:#{window_index},6},3},#{@nord_c3},#{?#{==:#{e|m:#{window_index},6},4},#{@nord_c4},#{?#{==:#{e|m:#{window_index},6},5},#{@nord_c5},#{@nord_c6}}}}}}"
set -g window-status-format "#[fg=#{E:@nord_wc},bg=#{@nord_bg},bold] #I #[nobold]#{?#{==:#{@claude_state},working},#[fg=#{@nord_warn}] ,}#{?#{==:#{@claude_state},waiting},#[fg=#{@nord_alert}] ,}#{?#{==:#{@claude_state},done},#[fg=#{@nord_ok}] ,}#[fg=#{@nord_muted}]#W#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=#{E:@nord_wc},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{E:@nord_wc},bold]#I #[fg=#{@nord_fg},bg=#{@nord_surface}] #[nobold]#{?#{==:#{@claude_state},working},#[fg=#{@nord_warn}] ,}#{?#{==:#{@claude_state},waiting},#[fg=#{@nord_alert}] ,}#{?#{==:#{@claude_state},done},#[fg=#{@nord_ok}] ,}#[fg=#{@nord_fg},bold]#W#[nobold]#{?window_zoomed_flag, ,} #[fg=#{@nord_surface},bg=#{@nord_bg}] "

# Claude Code state per window (set by ~/.local/bin/claude-tmux-state via Claude hooks):
#  hourglass = working, bell = waiting for you, check = finished (cleared when you visit the window)
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -wu @claude_state"'

# Mode indicators (prefix / copy / sync), then date, time and host
set -g status-right "#{?client_prefix,#[fg=#{@nord_yellow} bg=#{@nord_bg}]#[fg=#{@nord_accent_fg} bg=#{@nord_yellow} bold]PREFIX#[fg=#{@nord_yellow} bg=#{@nord_bg} nobold] ,}#{?pane_in_mode,#[fg=#{@nord_yellow} bg=#{@nord_bg}]#[fg=#{@nord_accent_fg} bg=#{@nord_yellow} bold]COPY#[fg=#{@nord_yellow} bg=#{@nord_bg} nobold] ,}#{?synchronize-panes,#[fg=#{@nord_green} bg=#{@nord_bg}]#[fg=#{@nord_accent_fg} bg=#{@nord_green} bold]SYNC#[fg=#{@nord_green} bg=#{@nord_bg} nobold] ,}#[fg=#{@nord_c2},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{@nord_c2}] #[fg=#{@nord_fg},bg=#{@nord_surface}] #{cpu_percentage} #[fg=#{@nord_surface},bg=#{@nord_bg}] #[fg=#{@nord_c3},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{@nord_c3}] #[fg=#{@nord_fg},bg=#{@nord_surface}] #{ram_percentage} #[fg=#{@nord_surface},bg=#{@nord_bg}] #[fg=#{@nord_c5},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{@nord_c5}]#{battery_icon_status} #[fg=#{@nord_fg},bg=#{@nord_surface}] #{battery_percentage} #[fg=#{@nord_surface},bg=#{@nord_bg}] #[fg=#{@nord_c1},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{@nord_c1}] #[fg=#{@nord_fg},bg=#{@nord_surface}] %a %b %d  %H:%M #[fg=#{@nord_surface},bg=#{@nord_bg}] #[fg=#{@nord_c6},bg=#{@nord_bg}]#[fg=#{@nord_on},bg=#{@nord_c6}] #[fg=#{@nord_fg},bg=#{@nord_surface}] #h #[fg=#{@nord_surface},bg=#{@nord_bg}]"
# -------------------------------------------------------------------------------

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
